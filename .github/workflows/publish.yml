# Публікація пакетів у JSR (docs/development-plan.md, 4.5).
#
# Запуск — САМ, після зеленого CI на master. Публікуються лише пакети, чия
# версія з deno.json ще відсутня в реєстрі: бамп версії в коміті і є командою на
# реліз, решта тихо пропускається — тому запуск ідемпотентний і «воркспейс
# перевидає вже опубліковане» неможливе.
#
# Кнопка була гіршою за автоматику рівно тим, чим кнопка й буває: вона
# публікувала КОМІТ, а не намір. Пуш, зроблений після натискання, у реліз не
# потрапляв — і це не «поїде наступним разом»: номери версій із опублікованого
# коміту вже в реєстрі, тож правка, дописана після, лишалася без номера. Так
# згоріли tools@0.13.12, skills@0.1.23 і create@0.7.22.
#
# `workflow_run`, а не `on: push`: гейтом тут завжди був зелений CI ЦЬОГО коміту,
# а на пуші він щойно стартував. Тепер черга природна — пуш → CI → зелений →
# публікація того самого SHA, і вікна між наміром і комітом немає.
#
# Кнопка лишається другим входом: реліз може впасти не через код (реєстр лежить,
# мережа), і перезапускати заради цього CI безглуздо. На цьому шляху зелений CI
# перевіряється явно — гейт нижче.
#
# Чого автоматика НЕ вирішує: «змінив пакет, а версію не підняв». Це ловиться
# раніше й в іншому місці — кроком `scaffold:verify` «вміст проти реєстру», який
# входить у той самий CI, що тут гейтить.
#
# Автентифікація — OIDC: пакети зв'язані з цим репозиторієм у налаштуваннях на
# jsr.io, жодних токенів у секретах. Право id-token: write — саме для цього.
name: Publish to JSR

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write # тег jsr/<пакет>@<версія> на опублікований коміт — точка відліку
                  # для перевірки «вміст проти реєстру» в scaffold:verify
  actions: read   # гейту потрібно читати прогони CI через GitHub API
  id-token: write

jobs:
  # Гейт — зелений CI цього ж коміту, а не повторний прогін перевірок:
  # test:unit там стереже свіжість generated-файлів, scaffold:verify:local —
  # шаблон (саме його пропуск випустив зламаний create@0.1.4) і склад пакетів
  # проти реєстру. «:local» тут принципове: гейт не може вимагати перевірки
  # проти реєстру, бо перевіряти там до релізу нічого — див. коментар до джоба
  # scaffold у ci.yml.
  #
  # На автоматичному шляху перевіряти нічого: подія і Є завершенням CI, лишається
  # відсіяти незелений. На ручному — питаємо API, як і раніше.
  gate:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    outputs:
      # Коміт релізу. Для workflow_run це SHA прогону, що нас розбудив, — саме
      # його треба взяти явно: за замовчуванням checkout дав би голову гілки на
      # момент запуску, тобто, можливо, вже НЕ той коміт, чий CI був зелений.
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - id: target
        run: echo "sha=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"
      - name: Require green CI for this commit
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${{ steps.target.outputs.sha }}&per_page=1" \
            --jq '.workflow_runs[0].conclusion // empty')
          if [ "$conclusion" != "success" ]; then
            echo "CI для ${{ steps.target.outputs.sha }} не зелений (стан: ${conclusion:-не знайдено})." >&2
            echo "Дочекайтеся зеленого прогону CI і запустіть публікацію знову." >&2
            exit 1
          fi

  publish:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.gate.outputs.sha }}
          # Повна історія і теги: перевірка «вміст проти реєстру» в post-release
          # кроці міряє від тега публікації, а на глибині 1 git log бреше
          # (граничний коміт диффиться проти порожнього дерева, і будь-який
          # каталог «змінювався» в ньому). З мілкою історією крок пропускається
          # чесно, але тут вердикт потрібен справжній.
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install dependencies
        run: deno install
      # deno install міг оновити deno.lock (якщо imports мінялися без локального
      # install) — публікації це не стосується, а брудне дерево її валить.
      - name: Restore lockfile
        run: git checkout -- deno.lock
      # Порядок — за залежностями: server → client → tools → skills → create.
      # skills саме перед create: той на нього посилається (scaffold розкладає
      # скіли тим самим викликом, що й `deno task skills:sync`), і зворотний
      # порядок дав би create з нерозв'язною залежністю. Публікація йде з
      # каталогу пакета: воркспейс із кореня спробував би перевидати все.
      #
      # mcp останнім і осторонь: на нього не посилається ніхто, а сам він не
      # залежить від жодного пакета фреймворку — ходить у базу по HTTP. Тому
      # його версія рухається окремо від решти й нічого за собою не тягне.
      # Взаємні залежності при перевірці резолвляться локально (воркспейс), тож
      # minimum dependency age свіжої версії тут не заважає.
      - name: Publish packages with new versions
        run: |
          set -euo pipefail
          for pkg in server client tools skills create mcp; do
            # deno.json — це JSONC (у server/ є //-коментарі), jq його не бере;
            # реєстр теж читаємо Deno-скриптом: збій мережі тоді валить крок
            # голосно, а не тихо перетворюється на «публікувати все».
            # --no-lock: інакше eval дописує @std/jsonc у deno.lock, дерево
            # стає брудним, і deno publish відмовляється працювати.
            version=$(deno eval --no-lock 'import { parse } from "jsr:@std/jsonc@1"; console.log(parse(await Deno.readTextFile(Deno.args[0])).version)' "$pkg/deno.json")
            published=$(deno eval --no-lock '
              const [pkg, version] = Deno.args;
              const response = await fetch(`https://jsr.io/@altera/${pkg}/meta.json`);
              if (!response.ok && response.status !== 404) throw new Error(`jsr.io: HTTP ${response.status}`);
              const meta = response.ok ? await response.json() : { versions: {} };
              console.log(version in (meta.versions ?? {}));
            ' "$pkg" "$version")
            if [ "$published" = "true" ]; then
              echo "= @altera/$pkg@$version вже в реєстрі — пропуск"
              continue
            fi
            echo "→ публікую @altera/$pkg@$version"
            (cd "$pkg" && deno publish)
            # Тег — точка відліку для перевірки «вміст проти реєстру»: реліз
            # законно їде поїздом комітів, і рахувати від коміта-бампа не можна —
            # публікується head. Не зірвати публікацію через тег: він допоміжний.
            git tag "jsr/$pkg@$version" || true
            git push origin "jsr/$pkg@$version" || echo "⚠ тег jsr/$pkg@$version не запушено"
          done

      # Post-release. До публікації цю перевірку зробити ніде: вона ставить
      # пакети з реєстру, а їх там ще немає. Покриває єдине, чого не бачить
      # `scaffold:verify:local`, — вендорений розклад: пресет визначає каталог
      # фреймворку з власного `import.meta.url`, і лише тут той приїжджає як
      # `https://jsr.io/...`, тобто йде гілка `vendor/jsr.io/<пакет>/<версія>`.
      #
      # Червоний крок означає не «публікацію скасовано» — версія на jsr уже
      # назавжди, — а «потрібен фікс-реліз». Саме тому крок голосний.
      - name: Post-release scaffold verify (from JSR)
        run: |
          set -uo pipefail
          # Кілька спроб із паузами: meta.json пакета розходиться по кеші
          # реєстру не миттєво. Перший реліз із цим кроком (client@0.5.0) був
          # тут червоним, і повтор через 30 с — теж, а та сама перевірка через
          # кілька хвилин пройшла без жодних змін. Тобто 30 с просто замало;
          # вікно тут ~5 хв.
          for wait in 0 60 120 120; do
            [ "$wait" = 0 ] || { echo "чекаю ${wait} с і повторюю"; sleep "$wait"; }
            if deno task scaffold:verify; then exit 0; fi
          done
          echo "::error::scaffold:verify червоний і після повторів — пакети вже в реєстрі, потрібен фікс-реліз"
          exit 1
